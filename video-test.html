<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Easy AI Training HLS Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            max-width: 900px;
            display: block;
            background: #000;
        }

        #status {
            margin-top: 15px;
            padding: 12px;
            background: #fff;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1>Easy AI Training HLS Test</h1>

    <button id="startTest">
    👉 Tap to Start Training
</button>

    <video
        id="testVideo"
        controls
        playsinline
        preload="metadata"
    ></video>

    <div id="status">
        Loading video...
    </div>

    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

    <script>

        const video = document.getElementById("testVideo");
        const startTest = document.getElementById("startTest");
        const status = document.getElementById("status");

        const hlsUrl =
            "https://vz-d09f10b5-f8a.b-cdn.net/a8b08dd7-ebf5-417e-b793-a7f9ec72cf55/playlist.m3u8";

      // -------------------------------------
// HLS PLAYBACK TEST
// HLS.js FIRST, NATIVE HLS FALLBACK
// -------------------------------------

let hls = null;

if (
    typeof Hls !== "undefined" &&
    Hls.isSupported()
) {

    status.textContent =
        "HLS.js supported. Loading stream...";

    hls = new Hls({
        debug: false
    });

    hls.loadSource(hlsUrl);

    hls.attachMedia(video);

    hls.on(
        Hls.Events.MEDIA_ATTACHED,
        function () {

            console.log(
                "HLS.js media attached successfully."
            );

        }
    );

    hls.on(
        Hls.Events.MANIFEST_PARSED,
        function () {

            console.log(
                "HLS.js manifest parsed successfully."
            );

            status.textContent =
                "HLS.js loaded successfully. Tap Start Training.";

        }
    );

    hls.on(
        Hls.Events.ERROR,
        function (
            event,
            data
        ) {

            console.error(
                "HLS.js error:",
                data
            );

            status.textContent =
                "HLS.js error: " +
                (
                    data.details ||
                    data.type ||
                    "Unknown error"
                );

        }
    );

} else if (
    video.canPlayType(
        "application/vnd.apple.mpegurl"
    )
) {

    console.log(
        "Using native HLS fallback."
    );

    video.src =
        hlsUrl;

    video.load();

    status.textContent =
        "Native HLS supported. Tap Start Training.";

} else {

    console.error(
        "No supported HLS playback method found."
    );

    status.textContent =
        "This browser does not support HLS playback.";

}

        startTest.addEventListener("click", async function () {

    console.log("Start button clicked");

    try {

        await video.play();

        status.textContent =
            "Playback started successfully.";

    } catch (error) {

        console.error("Playback failed:", error);

        status.textContent =
            "Playback failed: " + error.name;
    }

});

    </script>

</body>
</html>
